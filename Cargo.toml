[workspace]
resolver = "2"
members = [
    "crates/backchat-core",
    "crates/backchat-nostr",
    "crates/backchat-ble",
    "crates/backchat",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Unlicense"
repository = "https://github.com/Letdown2491/backchat"

[workspace.dependencies]
# Wire format / crypto (backchat-core)
snow = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
flate2 = "1"
hex = "0.4"
chacha20poly1305 = "0.10"
thiserror = "2"
num_enum = "0.7"

# Nostr transport (backchat-nostr)
secp256k1 = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# BLE transport (backchat-ble)
bluer = "0.17"

# UI (backchat-app)
gpui = "0.2"
unicode-segmentation = "1"

[profile.release]
lto = "thin"

# Vendored xattr 0.2.3 (via gpui → gpui_http_client → zed-async-tar): newer
# libc removed the non-standard ENOATTR on Linux. See vendor-patches/xattr
# for the one-line patch; drop this once zed-async-tar moves to xattr 1.x.
# Lives outside vendor/ because vendor/ is cargo-vendor output, wiped and
# regenerated by scripts/vendor.sh.
[patch.crates-io]
xattr = { path = "vendor-patches/xattr" }
