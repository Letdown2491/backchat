[workspace]
resolver = "2"
members = [
    "crates/bitchat-core",
    "crates/bitchat-nostr",
    "crates/bitchat-ble",
    "crates/bitchat-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Unlicense"
repository = "https://github.com/Letdown2491/bitchat-rs"

[workspace.dependencies]
# Wire format / crypto (bitchat-core)
snow = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
flate2 = "1"
hex = "0.4"
chacha20poly1305 = "0.10"
thiserror = "2"
num_enum = "0.7"

# Nostr transport (bitchat-nostr)
secp256k1 = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# BLE transport (bitchat-ble)
bluer = "0.17"

# UI (bitchat-app)
gpui = "0.2"
unicode-segmentation = "1"

[profile.release]
lto = "thin"

# Vendored xattr 0.2.3 (via gpui → gpui_http_client → zed-async-tar): newer
# libc removed the non-standard ENOATTR on Linux. See vendor/xattr for the
# one-line patch; drop this once zed-async-tar moves to xattr 1.x.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
