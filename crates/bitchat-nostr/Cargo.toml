[package]
name = "bitchat-nostr"
description = "bitchat over Nostr: geohash channels, bitchat1: embedded packets, private envelopes (kind 13/14/1059)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bitchat-core = { path = "../bitchat-core" }
ureq = { version = "2", default-features = false, features = ["tls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
chacha20poly1305.workspace = true
hkdf = "0.12"
hmac = "0.12"
hex.workspace = true
secp256k1 = { version = "0.31", features = ["rand", "hashes"] }
base64 = "0.22"
rand = "0.9"
tokio = { workspace = true, features = ["sync", "time", "net"], optional = true }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

#[dev-dependencies]
secp256k1 = { workspace = true, features = ["rand", "hashes"] }

[features]
default = ["relay"]
relay = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]
